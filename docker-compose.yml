# ==============================================================================
# 🤖 SENSORBOT AI MODEL CONFIGURATION
# ==============================================================================
# To test any model, simply change the value of '&ai_model' below!
#
# POPULAR MODELS YOU CAN TEST:
#   "qwen2.5:1.5b"     <- Default: ultra-fast, lightweight (1.5B)
#   "llama3.2:1b"      <- Meta LLaMA 3.2 (1B edge model)
#   "llama3.2:3b"      <- Meta LLaMA 3.2 (3B model, great balance)
#   "qwen2.5:3b"       <- Qwen 2.5 (3B, strong structured JSON extraction)
#   "deepseek-r1:1.5b" <- DeepSeek R1 reasoning model (reasoning tokens automatically stripped)
#   "mistral:7b"       <- Mistral 7B generalist model
#   "phi3:mini"        <- Microsoft Phi-3 (3.8B)
# ==============================================================================
x-ai-model: &ai_model "qwen2.5:1.5b"

services:
  # ---------------- Ollama (System-2 Reasoning LLM Inference Server) ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: sensorbot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: *ai_model
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        ollama serve &
        SERVER_PID=$$!
        echo "Waiting for Ollama service to start..."
        until ollama list > /dev/null 2>&1; do sleep 1; done
        echo "=================================================="
        echo " Target AI Model: $$OLLAMA_MODEL"
        echo "=================================================="
        if ! ollama list | grep -q "$$OLLAMA_MODEL"; then
          echo "Model '$$OLLAMA_MODEL' not cached yet. Downloading from Ollama registry..."
          ollama pull "$$OLLAMA_MODEL"
        else
          echo "Model '$$OLLAMA_MODEL' is already cached."
        fi
        echo "Pre-loading model '$$OLLAMA_MODEL' into RAM..."
        ollama run "$$OLLAMA_MODEL" --keepalive -1 "" || true
        echo "Model '$$OLLAMA_MODEL' is active, loaded in RAM, and ready for inference."
        wait $$SERVER_PID
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------- Postgres + TimescaleDB ----------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iam-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: iam_pass
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./iam-seed/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U iam_user -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot database seeder: seeds DB schema, assets, signals, and sample telemetry data
  seeder:
    build: ./iam-seed
    container_name: iam-seeder
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: iam_user
      PGPASSWORD: iam_pass
      PGDATABASE: iam_db
      SAMPLE_MINUTES: "1"
      MONTHS: "1"

  # ---------------- JEV (Laya) Decision Model Image ----------------
  jev-model:
    build:
      context: ./models
      dockerfile: Dockerfile
    image: jev-model:latest
    container_name: sensorbot_jev_model
    restart: unless-stopped
    volumes:
      - jev_model_data:/app/models/laya-multilingual/multilingual

  # ---------------- .NET 9 Backend Web API (Hosts Native In-Process .NET Decision Engine) ----------------
  backend:
    build:
      context: ./.net backend
      dockerfile: Dockerfile
    container_name: sensorbot_backend
    restart: unless-stopped
    ports:
      - "5500:5500"
    depends_on:
      timescaledb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      jev-model:
        condition: service_started
    volumes:
      - jev_model_data:/app/models/laya-multilingual/multilingual:ro
    environment:
      ConnectionStrings__TimescaleDb: "Host=timescaledb;Port=5432;Database=iam_db;Username=iam_user;Password=iam_pass"
      Llm__Endpoint: "http://ollama:11434/v1"
      Llm__Model: *ai_model
      Llm__TimeoutSeconds: "300"
      Laya__Enabled: "true"
      Laya__ModelDirectory: "/app/models/laya-multilingual/multilingual"
      ASPNETCORE_URLS: "http://0.0.0.0:5500"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
      Cors__AllowedOrigins__2: "http://localhost:80"

  # ---------------- React Frontend App ----------------
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: sensorbot_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ---------------- Adminer (Web UI for PostgreSQL Database) ----------------
  adminer:
    image: adminer:latest
    container_name: sensorbot_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  ollama_data:
    driver: local
  pgdata:
    driver: local
  jev_model_data:
    driver: local