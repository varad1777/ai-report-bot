services:
  # ---------------- Ollama (System-2 Reasoning LLM Inference Server) ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: sensorbot_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        ollama serve &
        SERVER_PID=$$!
        echo "Waiting for Ollama service to start..."
        until ollama list > /dev/null 2>&1; do sleep 1; done
        echo "Ensuring Qwen 2.5 (1.5B) model is downloaded..."
        ollama pull qwen2.5:1.5b
        echo "Qwen 2.5 (1.5B) is ready for inference."
        wait $$SERVER_PID
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q 'qwen2.5:1.5b' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------------- Postgres + TimescaleDB ----------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iam-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: iam_user
      POSTGRES_PASSWORD: iam_pass
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./iam-seed/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U iam_user -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot database seeder: seeds DB schema, assets, signals, and sample telemetry data
  seeder:
    build: ./iam-seed
    container_name: iam-seeder
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      PGHOST: timescaledb
      PGPORT: "5432"
      PGUSER: iam_user
      PGPASSWORD: iam_pass
      PGDATABASE: iam_db
      SAMPLE_MINUTES: "1"
      MONTHS: "1"

  # ---------------- JEV (Laya) Decision Model Image ----------------
  jev-model:
    build:
      context: ./models
      dockerfile: Dockerfile
    image: jev-model:latest
    container_name: sensorbot_jev_model
    restart: unless-stopped
    volumes:
      - jev_model_data:/app/models/laya-multilingual/multilingual

  # ---------------- .NET 9 Backend Web API (Hosts Native In-Process .NET Decision Engine) ----------------
  backend:
    build:
      context: ./.net backend
      dockerfile: Dockerfile
    container_name: sensorbot_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      timescaledb:
        condition: service_healthy
      ollama:
        condition: service_healthy
      jev-model:
        condition: service_started
    volumes:
      - jev_model_data:/app/models/laya-multilingual/multilingual:ro
    environment:
      ConnectionStrings__TimescaleDb: "Host=timescaledb;Port=5432;Database=iam_db;Username=iam_user;Password=iam_pass"
      Llm__Endpoint: "http://ollama:11434/v1"
      Llm__Model: "qwen2.5:1.5b"
      Llm__TimeoutSeconds: "300"
      Laya__Enabled: "true"
      Laya__ModelDirectory: "/app/models/laya-multilingual/multilingual"
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      Cors__AllowedOrigins__0: "http://localhost:5173"
      Cors__AllowedOrigins__1: "http://localhost:5174"
      Cors__AllowedOrigins__2: "http://localhost:80"

  # ---------------- React Frontend App ----------------
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: sensorbot_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ---------------- Adminer (Web UI for PostgreSQL Database) ----------------
  adminer:
    image: adminer:latest
    container_name: sensorbot_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  ollama_data:
    driver: local
  pgdata:
    driver: local
  jev_model_data:
    driver: local